---
layout: default
---

<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      Posted on <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
      {% if page.tags %}
        | Tags: 
        {% for tag in page.tags %}
          <a href="{{ site.baseurl }}/tags/{{ tag | slugify }}/">{{ tag }}</a>{% if forloop.last == false %}, {% endif %}
        {% endfor %}
      {% endif %}
    </p>
  </header>

  <section class="post-content">
    {{ content }}
  </section>

  <footer class="post-footer">
    <p>Thank you for reading! Feel free to leave a comment.</p>
  </footer>

  <section class="post-comments">
    <script src="https://giscus.app/client.js"
      data-repo="eigenval/my-website"
      data-repo-id="R_kgDONQqAVw"
      data-category="Announcements"
      data-category-id="DIC_kwDONQqAV84DHKEp"
      data-mapping="pathname"
      data-strict="0"
      data-reactions-enabled="1"
      data-emit-metadata="0"
      data-input-position="bottom"
      data-theme="light"
      data-lang="en"
      crossorigin="anonymous"
      async>
    </script>
  </section>
</article>

<style>
  .post-title {
    font-size: 2.5rem;
    font-weight: bold;
  }
  .post-meta {
    color: gray;
    font-size: 0.9rem;
  }
  .post-content {
    margin-top: 20px;
  }
  .post-note {
    color: #767676;
    font-size: 0.85rem;
    border-left: 3px solid #eaeaea;
    padding-left: 0.8em;
  }
  .post-footer {
    margin-top: 40px;
    text-align: center;
    color: #888;
  }
  .post-comments {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid #eaeaea;
  }
</style>
